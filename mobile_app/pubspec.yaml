name: document_scanner_app
description: Professional document scanner for Android and iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera and image handling
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  image: ^4.1.3

  # Image processing
  edge_detection: ^1.1.1

  # Storage and permissions
  path_provider: ^2.1.1
  permission_handler: ^11.0.1

  # Share functionality
  share_plus: ^7.2.1

  # UI components
  cupertino_icons: ^1.0.6
  flutter_speed_dial: ^7.0.0

  # State management
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
