<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agence de Développement IA</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Agence de Développement IA</h1>
        <p>Décrivez l'application que vous souhaitez créer, et notre équipe d'agents IA la construira pour vous.</p>

        <div id="generation-form">
            <textarea id="project-description" placeholder="Exemple : Une simple API de blog en FastAPI avec des routes pour lister et créer des articles."></textarea>
            <button id="generate-btn">Générer le projet</button>
        </div>

        <div id="status-area"></div>

        <div id="results-area" class="hidden">
            <h2>Résultats du Projet (<span id="project-id-display"></span>)</h2>
            <div id="code-files"></div>

            <hr>

            <h3>Faire une modification</h3>
            <div id="refinement-form">
                <textarea id="feedback-text" placeholder="Exemple : Ajoute une route pour supprimer un article par son ID."></textarea>
                <button id="refine-btn">Raffiner le projet</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
